services:
  - type: web
    name: college-trip-voting
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: VOTING_HOURS
        value: "3000"
      - key: MONGODB_URI
        sync: false

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voting Admin</title><style>body{font:15px system-ui;margin:25px;background:#f5f7fb;color:#17233c}main{max-width:1100px;margin:auto;background:white;padding:24px;border-radius:16px}input,button{padding:11px;margin:6px;border-radius:8px;border:1px solid #ccc}button{background:#1d4ed8;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;text-align:left;padding:9px}section{overflow-x:auto}#error{color:#b91c1c}</style></head><body><main><h1>College Trip — Admin</h1><div id="signin"><input id="password" type="password" placeholder="Admin password"><button onclick="login()">Login</button></div><div id="panel" hidden><p id="stats"></p><button onclick="load()">Refresh</button><button onclick="closeVoting()">Close voting</button><a href="/api/export">Download CSV</a><section><table><thead><tr><th>Roll</th><th>Name</th><th>Phone</th><th>Status</th><th>Agency</th><th>Time (IST)</th></tr></thead><tbody id="rows"></tbody></table></section></div><p id="error"></p></main><script>
async function post(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify(body)});let x=await r.json();if(!r.ok)throw Error(x.error||'Failed');return x}
async function login(){try{await post('/api/admin/login',{password:document.getElementById('password').value});document.getElementById('signin').hidden=true;document.getElementById('panel').hidden=false;load()}catch(e){document.getElementById('error').textContent=e.message}}
async function load(){let r=await fetch('/api/admin/data',{headers:{'ngrok-skip-browser-warning':'1'}});if(!r.ok){document.getElementById('error').textContent='Admin login required';return}let d=await r.json();document.getElementById('stats').textContent=`${d.voted}/${d.total} voted | Travlog: ${d.counts.travlog} | Thilal: ${d.counts.thilal} | Stories: ${d.counts.stories} | Open: ${d.open}`;let tb=document.getElementById('rows');tb.replaceChildren();for(let s of d.students){let tr=document.createElement('tr');for(let v of [s.roll,s.name,s.phone,s.agency?'Voted':'Pending',s.agency||'-',s.time||'-']){let td=document.createElement('td');td.textContent=v;tr.append(td)}tb.append(tr)}}
async function closeVoting(){if(!confirm('Close voting now?'))return;try{await post('/api/admin/close',{});load()}catch(e){alert(e.message)}}
</script></body></html>
